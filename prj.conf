CONFIG_CACHE_MANAGEMENT=y
CONFIG_ICACHE=y

CONFIG_LOG=y
# All logging handled in dedicated thread (format + output); callers only enqueue
CONFIG_LOG_MODE_DEFERRED=y
# Increase buffer so high-rate logs don't drop (tune if needed)
CONFIG_LOG_BUFFER_SIZE=2048
# No log output — required when MCUmgr shares UART with console (camera running).
# Any log output can corrupt SMP responses. Use 1+ for debug when camera is off.
CONFIG_LOG_DEFAULT_LEVEL=0

# Full libc for TFLM and general use
CONFIG_REQUIRES_FULL_LIBC=y

CONFIG_DISPLAY=y
CONFIG_MIPI_DBI=y
CONFIG_SPI=y
CONFIG_SPI_STM32_DMA=y
CONFIG_GPIO=y
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_DMA=y
# UART DMA: when console UART has dmas in devicetree (uart_dma.overlay),
# the STM32 driver uses DMA if its Kconfig supports it (symbol name may vary per Zephyr/board).

CONFIG_I2C=y
CONFIG_VIDEO=y
CONFIG_VIDEO_OV5640=y
# Use out-of-tree STM32U5 DCMI driver (st,stm32u5-dcmi); in-tree driver not used
# CONFIG_VIDEO_STM32_DCMI=n
CONFIG_VIDEO_STM32U5_DCMI=y

# Heap set in Golioth block below (mbedTLS + Golioth + app)
CONFIG_VIDEO_BUFFER_POOL_SZ_MAX=64
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=2
CONFIG_VIDEO_BUFFER_POOL_ALIGN=64

# CONFIG_VIDEO_LOG_LEVEL_DBG=y
# CONFIG_DMA_LOG_LEVEL_DBG=y

CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_APP_ENABLE_INFERENCE=y
CONFIG_TENSORFLOW_LITE_MICRO=y
# Enable optimized CMSIS-NN kernels for TFLM (faster conv/depthwise/FC)
CONFIG_TENSORFLOW_LITE_MICRO_CMSIS_NN_KERNELS=y
CONFIG_MAIN_STACK_SIZE=1536
CONFIG_REQUIRES_FLOAT_PRINTF=y

# MCUBoot bootloader support
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
# Erase progressively so device responds faster (avoids full-slot erase before first chunk)
CONFIG_IMG_ERASE_PROGRESSIVELY=y

# MCUmgr SMP over UART (firmware update)
CONFIG_MCUMGR=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_SMP_COMMAND_STATUS_HOOKS=y
CONFIG_MCUMGR_GRP_IMG_STATUS_HOOKS=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
# Higher priority than camera (7) so MCUmgr image handler can preempt during DFU
CONFIG_SYSTEM_WORKQUEUE_PRIORITY=0
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=1024
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Entropy (required by networking stack for random number generation)
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=n

# Networking stack (required for WiFi)
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_LOG=y

# ESP-AT WiFi driver (WiFi ESP Click on UART4)
CONFIG_WIFI=y
CONFIG_WIFI_ESP_AT=y
# Zephyr ESP-AT driver supports up to 2.1.x in this SDK.
# We upgraded the modem to 2.2.2; 2.1 is the closest supported profile.
CONFIG_WIFI_ESP_AT_VERSION_2_1=y
# Above camera/display/inference (11): avoid sharing priority 7 with ESP-AT (starved I/O → -116).
CONFIG_WIFI_ESP_AT_RX_THREAD_PRIORITY=6
CONFIG_WIFI_ESP_AT_WORKQ_THREAD_PRIORITY=6
CONFIG_WIFI_LOG_LEVEL_ERR=y

# WiFi auto-connect at boot (configure SSID/PSK here)
CONFIG_WIFI_AUTOCONNECT=y
CONFIG_WIFI_AUTOCONNECT_SSID="My_SSID"
CONFIG_WIFI_AUTOCONNECT_PSK="My_SSID_PSK"
CONFIG_WIFI_AUTOCONNECT_SSID2=""
CONFIG_WIFI_AUTOCONNECT_PSK2=""
# CONFIG_WIFI_AUTOCONNECT_RETRY_TIMEOUT_S=60

# Golioth Firmware SDK + cloud OTA (see docs/GOLIOTH_OTA.md; clone SDK into modules/golioth-firmware-sdk)
# Golioth uses POSIX eventfd via ZVFS; defaults are too low with camera/TFLM/net — see golioth_sys_zephyr eventfd errors.
CONFIG_ZVFS_OPEN_MAX=32
CONFIG_ZVFS_EVENTFD_MAX=24
CONFIG_GOLIOTH_FIRMWARE_SDK=y
CONFIG_GOLIOTH_OTA=y
# After manifest: stop client if up to date or CONFIG_GOLIOTH_FW_UPDATE_PACKAGE_NAME not in manifest.
CONFIG_GOLIOTH_FW_UPDATE_IDLE_DISCONNECT=y
# Zephyr CoAP default path length is 12; OTA artifact URIs from the manifest are longer. SDK ties
# CONFIG_GOLIOTH_COAP_MAX_PATH_LEN to COAP_EXTENDED_OPTIONS_LEN_VALUE (see port/zephyr/Kconfig "CoAP").
CONFIG_COAP_EXTENDED_OPTIONS_LEN=y
CONFIG_COAP_EXTENDED_OPTIONS_LEN_VALUE=128
# Zephyr LOG_* for Golioth SDK modules (golioth_coap_client_zephyr, golioth_sys_zephyr, …); ERR only.
CONFIG_GOLIOTH_LOG_LEVEL_ERR=y
# GLTH_LOGX internal level in SDK (1 = error per modules/golioth-firmware-sdk/src/Kconfig.logging)
CONFIG_GOLIOTH_DEBUG_DEFAULT_LOG_LEVEL=1
CONFIG_GOLIOTH_AUTH_METHOD_PSK=y
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="1.1.1.1"
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=16384
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_IMG_ENABLE_IMAGE_CHECK=y
# Lab credentials: override CONFIG_GOLIOTH_APP_PSK_ID / CONFIG_GOLIOTH_APP_PSK (Kconfig defaults) or use menuconfig
# Heap: Golioth + mbedTLS + existing app (raise if OTA fails at runtime)
CONFIG_HEAP_MEM_POOL_SIZE=196608

# Shell disabled — USART1 is dedicated to MCUmgr SMP
# CONFIG_SHELL=y
# CONFIG_SHELL_BACKEND_SERIAL=y
# CONFIG_NET_SHELL=y
# CONFIG_NET_L2_WIFI_SHELL=y
