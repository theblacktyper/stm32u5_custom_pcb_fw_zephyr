# Stack usage instrumentation overlay (debug only).
# Use this overlay when profiling thread stack headroom, then remove it for normal runs.

# Required for per-thread stack accounting
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y

# Fill stacks with a known pattern so unused space can be measured
CONFIG_INIT_STACKS=y

# Detect stack overruns early during testing
CONFIG_STACK_SENTINEL=y

# Built-in Zephyr thread analyzer
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=15
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
CONFIG_THREAD_ANALYZER_ISR_STACK_USAGE=y
